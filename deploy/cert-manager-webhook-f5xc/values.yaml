groupName: acme.f5xc.io

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

image:
  repository: ghcr.io/wenkow/cert-manager-webhook-f5xc
  # Defaults to the chart's appVersion (an immutable, versioned tag) so that a
  # `helm upgrade` to a new chart version actually changes the image and triggers
  # a rollout. Override only to pin a specific tag.
  tag: ""
  pullPolicy: IfNotPresent

# Extra args passed to the webhook container. Use this to raise log verbosity,
# e.g. ["-v=2"] for operation logs or ["-v=4"] for per-request/response logs.
extraArgs: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 443

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
