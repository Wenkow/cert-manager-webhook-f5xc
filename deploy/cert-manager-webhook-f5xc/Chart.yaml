apiVersion: v2
name: cert-manager-webhook-f5xc
description: A cert-manager webhook solver for F5 Distributed Cloud DNS
version: 0.4.0
appVersion: "0.4.0"
type: application
keywords:
  - cert-manager
  - f5
  - f5xc
  - dns01
  - acme
  - webhook
icon: https://raw.githubusercontent.com/Wenkow/cert-manager-webhook-f5xc/main/deploy/cert-manager-webhook-f5xc/logo/logo.svg
home: https://github.com/Wenkow/cert-manager-webhook-f5xc
sources:
  - https://github.com/Wenkow/cert-manager-webhook-f5xc
maintainers:
  - name: "Martin Kylián"
annotations:
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: cert-manager-webhook-f5xc
      image: ghcr.io/wenkow/cert-manager-webhook-f5xc:0.4.0
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: fixed
      description: "Present is now idempotent — duplicate challenge values no longer cause HTTP 400 when multiple certificates are issued at once"
    - kind: fixed
      description: "CleanUp removes only its own challenge value instead of the whole RRSet, fixing finalizer deadlocks for shared FQDNs (apex + wildcard SANs)"
    - kind: fixed
      description: "CleanUp treats 'not found' (HTTP 404 / API code 5) as success, making it idempotent"
    - kind: added
      description: "Structured logging (klog) in Present/CleanUp and the F5 XC API client"
  artifacthub.io/links: |
    - name: cert-manager
      url: https://cert-manager.io
    - name: F5 Distributed Cloud
      url: https://www.f5.com/cloud
