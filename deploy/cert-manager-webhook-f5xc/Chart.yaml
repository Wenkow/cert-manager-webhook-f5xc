apiVersion: v2
name: cert-manager-webhook-f5xc
description: A cert-manager webhook solver for F5 Distributed Cloud DNS
version: 0.4.1
appVersion: "0.4.1"
type: application
keywords:
  - cert-manager
  - f5
  - f5xc
  - dns01
  - acme
  - webhook
icon: https://raw.githubusercontent.com/Wenkow/cert-manager-webhook-f5xc/main/deploy/cert-manager-webhook-f5xc/logo/logo.svg
home: https://github.com/Wenkow/cert-manager-webhook-f5xc
sources:
  - https://github.com/Wenkow/cert-manager-webhook-f5xc
maintainers:
  - name: "Martin Kylián"
annotations:
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: cert-manager-webhook-f5xc
      image: ghcr.io/wenkow/cert-manager-webhook-f5xc:0.4.1
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: fixed
      description: "Certificate (P12) auth no longer overrides RootCAs with the client chain — the F5 XC server cert is verified against the system trust store, removing a fallback that could break server verification"
    - kind: fixed
      description: "DeleteRRSet retries on transient code 14 (zone change pending), matching create/replace — fixes cleanup failures when issuing several certificates at once"
    - kind: fixed
      description: "Image tag now defaults to the chart appVersion instead of 'latest', so helm upgrade actually rolls out and pulls the new image"
  artifacthub.io/links: |
    - name: cert-manager
      url: https://cert-manager.io
    - name: F5 Distributed Cloud
      url: https://www.f5.com/cloud
