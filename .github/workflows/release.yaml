name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # The multi-arch image is built once by CI on the main commit. Here we only
  # re-tag that existing image to the release tags (semver + latest) via
  # `imagetools create` — no rebuild, no QEMU, runs in seconds. The image's
  # existence already proves CI (lint + test + build) passed for this commit.
  promote:
    name: Promote image to release tags
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve source image (built by CI on main)
        id: source
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wenkow/cert-manager-webhook-f5xc
          tags: type=sha,prefix=sha-,format=short
      - name: Compute release tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wenkow/cert-manager-webhook-f5xc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: Wait for CI multi-arch image to be ready
        env:
          SOURCE: ${{ steps.source.outputs.tags }}
        run: |
          echo "Waiting for $SOURCE (built by CI on main) ..."
          for i in $(seq 1 60); do
            if docker buildx imagetools inspect "$SOURCE" >/dev/null 2>&1; then
              echo "Found $SOURCE"
              exit 0
            fi
            echo "Not ready ($i/60) — CI build on main must finish first; sleeping 15s."
            sleep 15
          done
          echo "ERROR: $SOURCE not found after 15 min."
          echo "Ensure the tagged commit is on main and its CI run finished."
          exit 1
      - name: Promote (re-tag multi-arch manifest, no rebuild)
        env:
          SOURCE: ${{ steps.source.outputs.tags }}
          TARGET_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=(-t "$t")
          done <<< "$TARGET_TAGS"
          echo "Promoting $SOURCE -> ${args[*]}"
          docker buildx imagetools create "${args[@]}" "$SOURCE"

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    needs: [promote]
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: latest
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify chart version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CHART_VERSION=$(grep '^version:' deploy/cert-manager-webhook-f5xc/Chart.yaml | awk '{print $2}')
          if [ "$TAG" != "$CHART_VERSION" ]; then
            echo "ERROR: Tag $TAG does not match Chart.yaml version $CHART_VERSION"
            exit 1
          fi
      - name: Package Helm chart
        run: helm package deploy/cert-manager-webhook-f5xc
      - name: Push Helm chart as OCI artifact
        run: helm push cert-manager-webhook-f5xc-*.tgz oci://ghcr.io/wenkow/charts
      - name: Push Artifact Hub metadata
        uses: oras-project/setup-oras@v1
      - run: |
          oras push \
            ghcr.io/wenkow/charts/cert-manager-webhook-f5xc:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [promote, helm]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
        with:
          version: latest
      - name: Package Helm chart for release asset
        run: helm package deploy/cert-manager-webhook-f5xc
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: cert-manager-webhook-f5xc-*.tgz
