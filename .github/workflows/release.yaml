name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests
        run: go test -v -race ./f5xc/...

  docker:
    name: Docker (multi-arch)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wenkow/cert-manager-webhook-f5xc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: latest
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify chart version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CHART_VERSION=$(grep '^version:' deploy/cert-manager-webhook-f5xc/Chart.yaml | awk '{print $2}')
          if [ "$TAG" != "$CHART_VERSION" ]; then
            echo "ERROR: Tag $TAG does not match Chart.yaml version $CHART_VERSION"
            exit 1
          fi
      - name: Package Helm chart
        run: helm package deploy/cert-manager-webhook-f5xc
      - name: Push Helm chart as OCI artifact
        run: helm push cert-manager-webhook-f5xc-*.tgz oci://ghcr.io/wenkow/charts
      - name: Push Artifact Hub metadata
        uses: oras-project/setup-oras@v1
      - run: |
          oras push \
            ghcr.io/wenkow/charts/cert-manager-webhook-f5xc:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker, helm]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
        with:
          version: latest
      - name: Package Helm chart for release asset
        run: helm package deploy/cert-manager-webhook-f5xc
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: cert-manager-webhook-f5xc-*.tgz
