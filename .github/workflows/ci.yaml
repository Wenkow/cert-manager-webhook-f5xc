name: CI

on:
  pull_request:
    branches: ["**"]
    paths-ignore: ["**.md"]
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests
        run: go test -v -race ./f5xc/...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        run: go build -trimpath -ldflags="-s -w" -o /dev/null .
      - uses: azure/setup-helm@v5
        with:
          version: latest
      - name: Helm lint
        run: helm lint deploy/cert-manager-webhook-f5xc

  docker:
    name: Docker (multi-arch)
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    # Build images only on main for now. To also build on another branch
    # (e.g. for testing), extend this: || github.ref == 'refs/heads/<branch>'.
    # No QEMU: the Dockerfile cross-compiles natively via Go (BUILDPLATFORM +
    # GOOS/GOARCH) and the distroless stage only copies the binary.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wenkow/cert-manager-webhook-f5xc
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
